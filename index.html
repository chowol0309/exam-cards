<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e13" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f4f8">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>시험 카드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Black+Han+Sans&display=swap">
<style>
/* layout: one card at a time in a centered column, deck switch + mode chips on a sticky bar */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --ink:#111723; --sub:#5b6577; --line:#dce1e9; --code:#edf0f5;
  --lin:#0b8f86; --sec:#d93f4c; --acc:var(--lin); --acc-soft:color-mix(in srgb,var(--acc) 12%,transparent);
  --ok:#1f9d55; --no:#d97706;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",Consolas,"IBM Plex Sans KR","Malgun Gothic",ui-monospace,monospace;
  --f-big:"Black Han Sans","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0e13; --surface:#141922; --ink:#e7ebf1; --sub:#8b95a7; --line:#242b37; --code:#1a202a;
  --lin:#2cc9b9; --sec:#ff6470; --ok:#4ade80; --no:#fbbf24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0e13; --surface:#141922; --ink:#e7ebf1; --sub:#8b95a7; --line:#242b37; --code:#1a202a;
  --lin:#2cc9b9; --sec:#ff6470; --ok:#4ade80; --no:#fbbf24; color-scheme:dark}
html[data-deck="owasp"]{--acc:var(--sec)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.slot:focus-visible,.tile:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
code{font-family:var(--f-mono);font-size:.9em;background:var(--code);padding:.05em .4em;border-radius:5px;white-space:pre-wrap}
b{color:var(--acc);font-weight:700}
.app{max-width:680px;margin:0 auto}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-block:12px 10px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;flex:1;max-width:280px}
.seg button{position:relative;z-index:1;border:0;background:none;padding:7px 0;font-weight:700;font-size:14px;color:var(--sub);transition:color .3s}
.seg button[aria-pressed="true"]{color:#fff}
.seg i{position:absolute;inset:3px auto 3px 3px;width:calc(50% - 3px);border-radius:9px;background:var(--acc);transition:transform .5s var(--ease),background .3s}
html[data-deck="owasp"] .seg i{transform:translateX(100%)}
.count{margin-left:auto;font:600 13px var(--f-mono);color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.count em{font-style:normal;color:var(--ok)}.count s{text-decoration:none;color:var(--no)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--sub);transition:all .25s}
.chip[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:700}
.chip.mode{font-weight:700}
.prog{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);transition:width .6s var(--ease)}

/* card */
.stage{margin-top:16px;perspective:1200px}
.card{view-transition-name:card;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 22px 18px;box-shadow:0 1px 2px rgb(0 0 0/.04),0 12px 32px -12px rgb(0 0 0/.18);touch-action:pan-y;will-change:transform;min-width:0}
.card.drag{transition:none}
.card.back{transition:transform .5s var(--ease)}
.head{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub)}
.tag{background:var(--acc-soft);color:var(--acc);font-weight:700;padding:2px 9px;border-radius:999px}
.idx{margin-left:auto;font:600 12px var(--f-mono);font-variant-numeric:tabular-nums}
.mark{width:8px;height:8px;border-radius:50%;background:var(--line)}
.mark.ok{background:var(--ok)}.mark.no{background:var(--no)}
.title{font-size:clamp(22px,5.6vw,28px);line-height:1.3;font-weight:700;letter-spacing:-.02em;margin:10px 0 12px;text-wrap:balance}
.def p{margin:0 0 8px}
.rows{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:6px 0 10px;font-size:14.5px}
.rows dt{font:600 13.5px var(--f-mono);color:var(--acc);white-space:nowrap}
.rows dd{margin:0;min-width:0}
pre.ex{font:13px/1.55 var(--f-mono);background:var(--code);border-radius:12px;padding:12px 14px;overflow-x:auto;margin:10px 0 4px;white-space:pre}
.quiz{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.lab{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--sub);margin-bottom:4px}
.q{font-size:16.5px;font-weight:600;margin:0 0 12px;text-wrap:pretty}
.reveal{width:100%;border:1.5px solid var(--acc);color:var(--acc);background:var(--acc-soft);border-radius:14px;padding:12px;font-weight:700;font-size:15px;transition:transform .15s}
.reveal:active{transform:scale(.98)}
.ans{background:var(--acc-soft);border-radius:14px;padding:12px 14px;font-size:16px;font-weight:600;animation:open .55s var(--ease)}
@keyframes open{from{clip-path:inset(0 0 100% 0 round 14px);opacity:.3;transform:translateY(-6px)}to{clip-path:inset(0 0 0 0 round 14px);opacity:1;transform:none}}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.judge button{border:0;border-radius:14px;padding:13px;font-weight:700;font-size:15px;color:#fff;transition:transform .15s,filter .2s}
.judge button:active{transform:scale(.97)}
.judge .no{background:var(--no)}.judge .ok{background:var(--ok)}
:root[data-theme="dark"] .judge button{color:#0b0e13}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .judge button{color:#0b0e13}}
.nav{display:flex;align-items:center;gap:10px;margin-top:14px}
.nav button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;font-weight:600;color:var(--sub)}
.nav .sp{flex:1;text-align:center;font-size:12px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:48px 0}

/* owasp card */
.ow-top{display:flex;align-items:center;gap:16px;margin:8px 0 14px}
.glyph{font:400 clamp(64px,19vw,92px)/1 var(--f-big);color:var(--acc);flex:none;width:1.15em;text-align:center}
.ow-name{font-size:clamp(20px,5.2vw,25px);font-weight:700;line-height:1.3;letter-spacing:-.02em;text-wrap:balance}
.ow-en{font:500 12.5px var(--f-mono);color:var(--sub);margin-top:2px}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;background:var(--code);border-radius:12px;padding:10px 12px;border:0;text-align:left;width:100%;font-size:15px}
.slot .k{font-weight:700;font-size:13px;color:var(--acc);padding-top:1px}
.slot .v{transition:filter .5s var(--ease),opacity .5s;min-width:0}
.slot.hid .v{filter:blur(7px);opacity:.55;user-select:none}
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tools button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:600;color:var(--sub)}
.tools button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.essay{margin-top:12px;background:var(--acc-soft);border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.8;animation:open .55s var(--ease)}

/* order tiles */
.order{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 6px 10px;text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .2s}
.tile:active{transform:scale(.96)}
.tile .n{font:600 11px var(--f-mono);color:var(--sub)}
.tile .g{font:400 clamp(34px,10vw,48px)/1 var(--f-big);color:var(--acc);transition:filter .4s,opacity .4s}
.tile .nm{font-size:12px;font-weight:600;line-height:1.35;word-break:keep-all;transition:filter .4s,opacity .4s}
.tile.hn .nm,.tile.hg .g{filter:blur(6px);opacity:.4}
.otools{display:flex;gap:8px;flex-wrap:wrap}

/* glance */
.glance{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.gcard h3{margin:0 0 6px;font-size:16px}
.gcard .qa{margin-top:8px;font-size:14px;color:var(--sub)}
.gcard .qa strong{color:var(--ink)}
.tpl{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;line-height:1.85}
.tpl b{background:var(--acc-soft);padding:0 4px;border-radius:5px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;font-size:13.5px;min-width:760px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.04em}
td.k{font:400 22px var(--f-big);color:var(--acc);text-align:center}
td.nm{font-weight:700;white-space:nowrap}
::view-transition-old(card){animation:.32s var(--ease) both vt-out}
::view-transition-new(card){animation:.5s var(--ease) both vt-in}
@keyframes vt-out{to{transform:translateX(calc(var(--dir,1) * -40px)) rotate(calc(var(--dir,1) * -2deg));opacity:0}}
@keyframes vt-in{from{transform:translateX(calc(var(--dir,1) * 60px)) rotate(calc(var(--dir,1) * 2deg));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}::view-transition-old(card),::view-transition-new(card){animation:none}}
@media (max-width:420px){.card{padding:18px 16px 16px;border-radius:18px}.trow{gap:6px}}
</style>

</head>
<body>
<div class="app">
  <div class="bar"><div class="bar-in">
    <div class="row">
      <div class="seg" role="group" aria-label="과목">
        <i></i>
        <button id="dk-linux" aria-pressed="true">리눅스</button>
        <button id="dk-owasp" aria-pressed="false">정보보안</button>
      </div>
      <div class="count" id="count"></div>
    </div>
    <div class="chips" id="modes"></div>
    <div class="chips" id="chs"></div>
    <div class="prog"><i id="prog"></i></div>
  </div></div>
  <main id="main"></main>
</div>

<script type="text/plain" id="linux-data">
## c1 | 프롬프트
d: 사용자의 명령 입력을 기다리는 표시. 배시 셸에서 일반 사용자는 {{$}}, 시스템 관리자는 {{#}}.
x: user1@myubuntu:~$
x: user1 = 사용자 계정   myubuntu = 호스트 이름   ~ = 홈 디렉터리
d: 터미널을 열면 처음 위치는 사용자의 홈 디렉터리.
q: 시스템 관리자(root)의 프롬프트 기호는?
a: {{#}}

## c1 | 명령의 구조
d: 형식은 {{명령 [옵션] [인자]}}.
r: 옵션 || 세부 기능 선택. {{-}} 또는 {{--}}로 시작
r: 인자 || 명령에 전달하는 값. 주로 파일명이나 디렉터리명
x: ls             명령만
x: ls -a          명령 + 옵션
x: ls /tmp        명령 + 인자
x: ls -a /tmp     명령 + 옵션 + 인자
q: {{ls -a /tmp}} 에서 옵션과 인자는?
a: 옵션 {{-a}}, 인자 {{/tmp}}

## c1 | 명령 행 편집 · 터미널 종료
r: Ctrl+w || 단어 지우기 (단어는 공백으로 구분)
r: Ctrl+u || 문장 전체 지우기
r: exit || 터미널 접속 해제
r: Ctrl+d || 터미널 접속 해제
q: 명령 행에서 문장 전체를 지우는 키는?
a: {{Ctrl+u}} (단어 하나는 {{Ctrl+w}})

## c1 | 기초 명령 4개
r: date || 날짜와 시간 출력
r: clear || 화면을 지우고 커서를 왼쪽 위로
r: man 명령 || 명령의 사용법 출력
r: passwd || 사용자 계정의 비밀번호 변경
x: man clear
q: 명령의 사용법을 보여 주는 명령은?
a: {{man}}

## c2 | 파일의 종류 4가지
r: 일반 파일 || 텍스트·실행·이미지 파일 등 대부분. 실행·이미지 파일은 바이너리 파일
r: 디렉터리 || 디렉터리도 파일. 안에 든 파일과 하위 디렉터리 정보를 저장
r: 심벌릭 링크 || 원본 파일을 대신해 다른 이름을 붙인 것
r: 장치 파일 || 하드디스크·키보드 같은 장치도 파일로 취급
x: $ file .profile
x: .profile: ASCII text
x: $ file 다운로드
x: 다운로드: directory
q: 키보드나 하드디스크는 어떤 종류의 파일인가?
a: 장치 파일

## c2 | 디렉터리 기호
d: 디렉터리는 **트리 구조**. 출발점은 루트 디렉터리.
r: / || 루트 디렉터리 (맨 위)
r: . || 현재(작업) 디렉터리, {{pwd}}로 확인
r: .. || 부모(상위) 디렉터리. 루트 빼고 모두 있음
r: ~ || 홈 디렉터리 ({{~user1}} = user1의 홈)
r: - || 직전 작업 디렉터리 ({{cd -}})
q: 부모 디렉터리를 나타내는 기호는?
a: {{..}}

## c2 | 루트 아래 주요 디렉터리
r: /dev || 장치 파일
r: /etc || 설정 파일
r: /home || 사용자 홈 디렉터리
r: /root || root 계정의 홈 (루트 / 와 다름)
r: /tmp || 임시 파일, 재시작하면 삭제
r: /boot || 부팅에 필요한 커널 파일
r: /usr || 기본 실행 파일·라이브러리
r: /var || 로그처럼 자주 바뀌는 파일
r: /proc || 프로세스 정보 등 커널 정보
r: /media · /mnt || 외부 장치 연결(마운트) · 임시 마운트
q: 리눅스 설정 파일이 모여 있는 디렉터리는?
a: {{/etc}}

## c2 | 절대 경로 · 상대 경로
r: 절대 경로 || 루트부터 시작, **반드시 / 로 시작**, 항상 같음
r: 상대 경로 || 현재 디렉터리 기준, / 이외의 문자로 시작, 위로 갈 땐 {{..}}
x: 현재 디렉터리 = /home/user1
x: user1         절대  /home/user1
x: 다운로드       절대  /home/user1/다운로드
x: 다운로드       상대  다운로드  또는  ./다운로드
x: /etc/hosts     상대  ../../etc/hosts
x:                     (user1 → home → / 로 두 번 올라감)
q: 현재 {{/usr/lib}} 에 있다. 상대 경로로 {{/home/user1}} 에 가는 명령은?
a: {{cd ../../home/user1}}

## c2 | 파일 이름 규칙
d: {{/}}는 쓸 수 없다(경로 구분자). 알파벳·숫자·{{-}}·{{_}}·{{.}}만 쓴다. 공백과 {{* | " ' @ # $ % ^ &}}는 쓰지 않는다. 대문자와 소문자는 다르다. {{.}}으로 시작하면 **숨김 파일**.
r: 좋은 이름 || game.txt, hello.c, test, sample11
r: 나쁜 이름 || &game, *dir, my home, game\
r: 쓸 수 없음 || myhome/, /test, bad/name
q: {{bad/name}} 은 파일 이름으로 쓸 수 있나?
a: 없다. {{/}}는 경로 구분자라 이름에 못 쓴다.

## c3 | pwd · cd
r: pwd || 현재 디렉터리의 절대 경로 출력
r: cd 경로 || 그 디렉터리로 이동
r: cd · cd ~ || 홈 디렉터리로 (cd만 쓰는 게 가장 간단)
r: cd .. || 부모 디렉터리로
r: cd - || 직전 디렉터리로
x: $ cd /tmp
x: $ pwd
x: /tmp
q: 바로 전에 있던 디렉터리로 돌아가는 명령은?
a: {{cd -}}

## c3 | ls 옵션
r: -a || 숨김 파일 포함 전부
r: -A || {{.}} 과 {{..}} 만 빼고 전부
r: -l || 상세 정보
r: -d || 디렉터리 자체 정보 ({{ls -ld /}})
r: -i || inode 번호
r: -F || 파일 종류 기호 표시
r: -R || 하위 디렉터리까지
r: -L || 심벌릭 링크면 원본 정보
d: {{dir}}, {{vdir}} 은 ls의 심벌릭 링크.
q: 숨김 파일까지 보되 {{.}} 과 {{..}} 은 빼는 옵션은?
a: {{-A}}

## c3 | ls -F 기호
r: / || 디렉터리
r: @ || 심벌릭 링크
r: * || 실행 파일
r: 없음 || 일반 파일
x: $ ls -F
x: examples.desktop  다운로드/  바탕화면/  사진/
q: {{ls -F}} 결과 이름 뒤의 {{@}} 는?
a: 심벌릭 링크

## c3 | ls -l 한 줄 읽기
x: drwxr-xr-x  2  user1  user1  4096  11월 8 23:24  공개

## c4 | 파일의 구성과 inode

## c4 | 하드 링크 · ln
d: {{ln 원본 링크}}. 파일에 이름을 하나 더 붙인다. **inode 같음, 링크 수 +1**.
x: $ ls -l data1
x: -rw-r--r-- 1 user1 user1 223 11월 11 22:29 data1
x: $ ln data1 data1.ln
x: $ ls -l data1
x: -rw-r--r-- 2 user1 user1 223 11월 11 22:29 data1
d: 복사({{cp data1 data1.cp}})는 inode가 다른 별개 파일이라 수정해도 원본에 반영 안 됨.

a: 2

## c4 | 심벌릭 링크 · ln -s
d: {{ln -s 원본 링크}}. 원본을 가리키는 새 파일.
r: 종류 || {{l}}, 이름 뒤 {{-> 원본}}
r: inode || 원본과 **다름** (별개 파일)
r: 링크 수 || 늘지 않음
r: 내용 || 원본 파일의 경로 (그래서 크기 5 = data1 글자 수)

x: $ ln -s data1 data1.sl
x: $ ls -l data1.sl
x: lrwxrwxrwx 1 user1 user1 5 11월 12 11:26 data1.sl -> data1
q: 원본 data1 을 지우면 하드 링크와 심벌릭 링크는 각각 어떻게 되나?
a: 하드 링크는 그대로 읽힌다. 심벌릭 링크는 연결할 수 없다.

## A01 | 접 | 접근 제어 실패 | Broken Access Control
c: 서버가 사용자의 권한을 제대로 검사하지 않음
e: 일반 사용자가 URL을 바꿔 관리자 페이지에 들어가거나 다른 사람의 정보를 조회
h: 권한 상승, 개인정보 유출, 데이터 변조·삭제
f: 모든 요청마다 서버에서 권한 검증, 최소 권한 원칙(기본 거부)
s: 접근 제어 실패란 서버가 사용자의 권한을 제대로 검사하지 않아, 사용자가 자신의 권한을 벗어난 기능이나 데이터에 접근할 수 있는 취약점이다. 예를 들어 일반 사용자가 URL을 바꿔 관리자 페이지에 들어가거나 다른 사용자의 개인정보를 조회하는 경우가 있다. 이로 인해 권한 상승, 개인정보 유출, 데이터 변조 및 삭제 등의 피해가 발생할 수 있다. 이를 예방하려면 모든 요청마다 서버에서 권한을 검증하고, 기본적으로 접근을 거부한 뒤 필요한 권한만 주는 최소 권한 원칙을 적용해야 한다.

## A02 | 설 | 보안 설정 오류 | Security Misconfiguration
c: 서버·애플리케이션·DB의 보안 설정이 잘못됨
e: 기본 관리자 계정과 비밀번호를 그대로 쓰거나, 불필요한 기능을 켜 두거나, 클라우드 저장소를 외부에 공개
h: 무단 접근, 중요 정보 유출, 서버 장악
f: 기본 비밀번호 변경·불필요한 기능과 계정 제거, 정기 점검과 보안 패치
s: 보안 설정 오류란 서버, 애플리케이션, 데이터베이스 등의 보안 설정이 잘못되어 발생하는 취약점이다. 예를 들어 관리자 계정의 기본 비밀번호를 그대로 사용하거나, 불필요한 기능을 켜 두거나, 클라우드 저장소를 외부에 공개하는 경우가 있다. 이로 인해 무단 접근, 중요 정보 유출, 서버 장악 등의 피해가 발생할 수 있다. 이를 예방하려면 기본 비밀번호를 변경하고 불필요한 기능과 계정을 제거하며, 보안 설정을 정기적으로 점검하고 최신 보안 패치를 적용해야 한다.

## A03 | 공 | 소프트웨어 공급망 실패 | Software Supply Chain Failures

s: 소프트웨어 공급망 실패란 소프트웨어를 개발, 배포, 업데이트하는 과정에서 사용하는 외부 라이브러리나 도구에 문제가 있어 발생하는 취약점이다. 예를 들어 악성코드가 포함된 외부 라이브러리를 설치하거나 취약점이 있는 오래된 버전을 계속 사용하는 경우가 있다. 이로 인해 악성코드 감염, 데이터 유출, 시스템 전체 침해 등의 피해가 발생할 수 있다. 이를 예방하려면 신뢰할 수 있는 출처의 구성 요소만 사용하고, SBOM으로 구성 요소와 버전을 관리하며 최신 보안 업데이트를 적용해야 한다.

h: 비밀번호·개인정보·금융정보 탈취
f: HTTPS 같은 안전한 통신, 비밀번호는 솔트를 적용한 해시로 저장, 암호화 키 안전하게 관리
s: 암호화 실패란 중요한 데이터를 암호화하지 않거나 취약한 암호화 방식을 사용하여 발생하는 취약점이다. 예를 들어 비밀번호를 평문으로 저장하거나 HTTPS 없이 HTTP로 통신하는 경우가 있다. 이로 인해 비밀번호, 개인정보, 금융정보 탈취 등의 피해가 발생할 수 있다. 이를 예방하려면 HTTPS와 같은 안전한 통신을 사용하고, 비밀번호는 솔트를 적용한 안전한 해시로 저장하며 암호화 키를 안전하게 관리해야 한다.

## A05 | 인 | 인젝션 | Injection
c: 사용자 입력값을 검증하지 않고 SQL 쿼리나 명령어에 그대로 사용
e: 로그인 창에 ' OR '1'='1 을 넣는 SQL 인젝션, 게시글에 스크립트를 심는 XSS
h: DB 정보 유출·변조, 시스템 침해
f: 입력값 검증, 파라미터화된 쿼리(Prepared Statement), 출력 인코딩
s: 인젝션이란 사용자의 입력값을 검증하지 않고 SQL 쿼리나 명령어에 그대로 사용하여, 공격자가 넣은 악의적인 코드가 실행되는 취약점이다. 예를 들어 로그인 창에 ' OR '1'='1 같은 값을 넣어 인증을 우회하는 SQL 인젝션이나, 게시글에 스크립트를 심는 XSS가 있다. 이로 인해 데이터베이스 정보 유출 및 변조, 시스템 침해 등의 피해가 발생할 수 있다. 이를 예방하려면 사용자 입력값을 검증하고, 파라미터화된 쿼리(Prepared Statement)를 사용하며, 출력할 때 인코딩을 적용해야 한다.

## A06 | 설 | 안전하지 않은 설계 | Insecure Design
c: 설계 단계에서 보안 요구사항을 빠뜨림 (코딩 실수가 아니라 구조 자체의 문제)
e: 구매 수량이나 요청 횟수 제한을 설계하지 않아 비정상적으로 대량 구매·반복 요청
h: 비즈니스 로직 악용, 부정 거래, 서비스 장애
f: 처음부터 보안을 고려하는 시큐어 바이 디자인, 위협 모델링
s: 안전하지 않은 설계란 개발 전 설계 단계에서 보안 요구사항을 충분히 고려하지 않아 발생하는 취약점으로, 코딩 실수가 아니라 시스템 구조 자체의 문제이다. 예를 들어 구매 수량이나 요청 횟수에 제한을 설계하지 않아 공격자가 비정상적으로 대량 구매하거나 요청을 반복하는 경우가 있다. 이로 인해 비즈니스 로직 악용, 부정 거래, 서비스 장애 등의 피해가 발생할 수 있다. 이를 예방하려면 개발 초기부터 보안을 고려하는 시큐어 바이 디자인 원칙을 적용하고, 위협 모델링으로 예상 공격을 설계에 반영해야 한다.

## A07 | 인 | 인증 실패 | Authentication Failures
c: 시스템이 사용자의 신원을 제대로 확인하지 못함
e: 비밀번호를 반복 입력하는 무차별 대입 공격, 약한 비밀번호 허용, 허술한 세션 관리
h: 계정 탈취, 사용자 사칭, 개인정보 유출
f: 다중 요소 인증(MFA), 로그인 시도 횟수 제한, 세션·토큰 안전 관리
s: 인증 실패란 시스템이 사용자의 신원을 제대로 확인하지 못해 공격자가 다른 사용자로 위장하거나 계정에 접근할 수 있는 취약점이다. 예를 들어 공격자가 비밀번호를 반복해서 입력하는 무차별 대입 공격으로 다른 사용자의 계정에 로그인하는 경우가 있다. 이로 인해 계정 탈취, 사용자 사칭, 개인정보 유출 등의 피해가 발생할 수 있다. 이를 예방하려면 다중 요소 인증(MFA)을 적용하고, 로그인 시도 횟수를 제한하며, 세션과 인증 토큰을 안전하게 관리해야 한다.

## A08 | 무 | 소프트웨어 및 데이터 무결성 실패 | Software or Data Integrity Failures
c: 소프트웨어나 데이터가 변조되었는지 확인하지 않음
e: 서명 확인 없이 업데이트 파일을 설치하거나, 신뢰할 수 없는 데이터를 검증 없이 역직렬화
h: 악성코드 실행, 데이터 변조, 시스템 침해
f: 전자서명·해시값으로 무결성 검증, 신뢰할 수 있는 출처만 사용
s: 소프트웨어 및 데이터 무결성 실패란 소프트웨어나 데이터가 허가 없이 변조되었는지 확인하지 않아 발생하는 취약점이다. 예를 들어 전자서명을 확인하지 않고 업데이트 파일을 설치하거나, 신뢰할 수 없는 데이터를 검증 없이 역직렬화하는 경우가 있다. 이로 인해 악성코드 실행, 데이터 변조, 시스템 침해 등의 피해가 발생할 수 있다. 이를 예방하려면 전자서명과 해시값으로 무결성을 검증하고, 신뢰할 수 있는 출처의 파일과 데이터만 사용해야 한다.

## A09 | 로 | 보안 로깅 및 알림 실패 | Security Logging and Alerting Failures
c: 보안 관련 활동을 기록하지 않거나 이상 징후를 알리지 않음
e: 로그인 실패가 수십 번 반복돼도 기록이 남지 않고 관리자에게 알림이 가지 않음
h: 공격 탐지·대응 지연, 피해 확대, 원인 분석 어려움
f: 중요 이벤트 로그 기록과 변조 방지, 지속적인 모니터링과 즉시 알림
s: 보안 로깅 및 알림 실패란 시스템의 보안 관련 활동을 제대로 기록하지 않거나, 이상 징후가 생겨도 관리자에게 알리지 못하는 취약점이다. 예를 들어 공격자가 수십 번 로그인에 실패해도 기록이 남지 않고 관리자에게 알림이 가지 않는 경우가 있다. 이로 인해 공격 탐지와 대응이 늦어지고 피해가 커지며 사고 원인 분석이 어려워진다. 이를 예방하려면 중요한 보안 이벤트를 기록하고 로그가 변조되지 않도록 보호하며, 이상 징후를 모니터링해 즉시 알리는 체계를 갖춰야 한다.

## A10 | 예 | 부적절한 예외 처리 | Mishandling of Exceptional Conditions
c: 예상하지 못한 오류나 비정상 상황을 안전하게 처리하지 못함
e: 오류 화면에 내부 시스템 정보를 그대로 보여 주거나, 결제 도중 오류가 났는데 앞 작업을 되돌리지 않음
h: 내부 정보 노출, 데이터 불일치, 시스템 장애·부정 거래
f: 오류가 나도 안전한 상태 유지(일반적인 오류 메시지), 롤백, 오류 기록과 알림
s: 부적절한 예외 처리란 프로그램 실행 중 예상하지 못한 오류나 비정상적인 상황을 안전하게 처리하지 못해 발생하는 취약점이다. 예를 들어 오류가 났을 때 내부 시스템 정보가 담긴 상세 오류 메시지를 그대로 보여 주거나, 결제 도중 오류가 났는데 이전 작업을 되돌리지 않는 경우가 있다. 이로 인해 내부 정보 노출, 데이터 불일치, 시스템 장애 및 부정 거래 등의 피해가 발생할 수 있다. 이를 예방하려면 오류가 나도 안전한 상태를 유지하도록 처리하고, 중요한 작업은 롤백하며, 오류를 기록하고 알리는 체계를 갖춰야 한다.
</script>

<script>
(function(){
var CH={c1:'명령 기초',c2:'파일·경로',c3:'디렉터리',c4:'파일 명령',c5:'vi',c6:'셸',c7:'root 보충'};
function parseLinux(t){
  var out=[],cur=null;
  t.split('\n').forEach(function(line){
    if(line.indexOf('## ')===0){var p=line.slice(3).split(' | ');cur={ch:p[0].trim(),t:p[1].trim(),blocks:[],q:'',a:''};out.push(cur);return}
    if(!cur)return;
    var k=line.slice(0,2),v=line.slice(3);
    if(k==='d:')cur.blocks.push({k:'d',v:v});
    else if(k==='r:'){var last=cur.blocks[cur.blocks.length-1];var kv=v.split(' || ');if(!last||last.k!=='r'){last={k:'r',v:[]};cur.blocks.push(last)}last.v.push(kv)}
    else if(k==='x:'){var l2=cur.blocks[cur.blocks.length-1];if(!l2||l2.k!=='x'){l2={k:'x',v:[]};cur.blocks.push(l2)}l2.v.push(line.length>3?v:'')}
    else if(k==='q:')cur.q=v;
    else if(k==='a:')cur.a=v;
  });
  out.forEach(function(c,i){c.id='L'+i});
  return out;
}
function parseOwasp(t){
  var out=[],cur=null;
  t.split('\n').forEach(function(line){
    if(line.indexOf('## ')===0){var p=line.slice(3).split(' | ');cur={id:p[0],g:p[1],nm:p[2],en:p[3]};out.push(cur);return}
    if(!cur)return;
    var k=line.slice(0,1),v=line.slice(3);
    if('cehfs'.indexOf(k)>-1&&line[1]===':')cur[k]=v;
  });
  return out;
}
var L=parseLinux(document.getElementById('linux-data').textContent);
var O=parseOwasp(document.getElementById('owasp-data').textContent);

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(s){return esc(s).replace(/\{\{(.+?)\}\}/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

var S=store('exam-state')||{};
var st={deck:S.deck||'linux',mode:S.mode||'card',ch:S.ch||'all',idx:S.idx||{linux:0,owasp:0},omode:S.omode||'card',hide:S.hide||0};
var marks={linux:store('mk-linux')||{},owasp:store('mk-owasp')||{}};
var revealed=false,shown={},essay=false;
function save(){store('exam-state',st);store('mk-linux',marks.linux);store('mk-owasp',marks.owasp)}

var main=document.getElementById('main'),modesEl=document.getElementById('modes'),chsEl=document.getElementById('chs'),countEl=document.getElementById('count'),progEl=document.getElementById('prog');

function list(){
  if(st.deck==='linux'){
    var a=L.filter(function(c){return st.ch==='all'||c.ch===st.ch});
    if(st.mode==='no')a=a.filter(function(c){return marks.linux[c.id]==='no'});
    return a;
  }
  if(st.omode==='no')return O.filter(function(c){return marks.owasp[c.id]==='no'});
  return O;
}
function mode(){return st.deck==='linux'?st.mode:st.omode}

function chip(label,on,fn,cls){var b=document.createElement('button');b.className='chip'+(cls?' '+cls:'');b.textContent=label;b.setAttribute('aria-pressed',on?'true':'false');b.onclick=fn;return b}

function renderBars(){
  document.documentElement.dataset.deck=st.deck;
  document.getElementById('dk-linux').setAttribute('aria-pressed',st.deck==='linux');
  document.getElementById('dk-owasp').setAttribute('aria-pressed',st.deck==='owasp');
  modesEl.innerHTML='';chsEl.innerHTML='';
  var m=mode();
  var defs=st.deck==='linux'?[['card','카드'],['no','모름만'],['all','한눈에']]:[['card','카드'],['order','순서'],['no','모름만'],['all','한눈에']];
  defs.forEach(function(d){modesEl.appendChild(chip(d[1],m===d[0],function(){setMode(d[0])},'mode'))});
  if(st.deck==='linux'&&m!=='all'){
    chsEl.hidden=false;
    chsEl.appendChild(chip('전체',st.ch==='all',function(){st.ch='all';st.idx.linux=0;go(0)}));
    Object.keys(CH).forEach(function(k){chsEl.appendChild(chip(CH[k],st.ch===k,function(){st.ch=k;st.idx.linux=0;go(0)}))});
    var on=chsEl.querySelector('[aria-pressed="true"]');if(on)on.scrollIntoView({block:'nearest',inline:'nearest'});
  } else chsEl.hidden=true;
  var all=st.deck==='linux'?L:O,mk=marks[st.deck],ok=0,no=0;
  all.forEach(function(c){if(mk[c.id]==='ok')ok++;else if(mk[c.id]==='no')no++});
  countEl.innerHTML='<em>알아 '+ok+'</em> · <s>모름 '+no+'</s> · '+all.length;
  progEl.style.width=(all.length?((ok+no)/all.length*100):0)+'%';
}

function setMode(m){if(st.deck==='linux')st.mode=m;else st.omode=m;revealed=false;shown={};essay=false;st.idx[st.deck]=0;go(0)}

function go(dir){
  var run=function(){renderBars();render();save()};
  if(dir&&document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.documentElement.style.setProperty('--dir',dir>0?1:-1);
    document.startViewTransition(run);
  } else run();
}

function step(d){
  var a=list();if(!a.length)return;
  var i=st.idx[st.deck]+d;if(i<0||i>=a.length)return;
  st.idx[st.deck]=i;revealed=false;shown={};essay=false;go(d);
}
function judge(v){
  var a=list(),c=a[st.idx[st.deck]];if(!c)return;
  marks[st.deck][c.id]=v;
  if(mode()==='no'&&v==='ok'){revealed=false;shown={};essay=false;var n=list().length;if(st.idx[st.deck]>=n)st.idx[st.deck]=Math.max(0,n-1);go(1);return}
  if(st.idx[st.deck]<a.length-1)step(1);else{save();renderBars();render()}
}

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}

function linuxBody(c,box){
  c.blocks.forEach(function(b){
    if(b.k==='d')box.appendChild(el('div','def','<p>'+fmt(b.v)+'</p>'));
    else if(b.k==='r'){var dl=el('dl','rows');b.v.forEach(function(kv){dl.appendChild(el('dt','',esc(kv[0])));dl.appendChild(el('dd','',fmt(kv[1]||'')))});box.appendChild(dl)}
    else if(b.k==='x'){var pre=el('pre','ex');pre.textContent=b.v.join('\n');box.appendChild(pre)}
  });
}

function cardShell(tagText,idxText,markV){
  var card=el('article','card');
  var head=el('div','head');
  head.appendChild(el('span','tag',esc(tagText)));
  var mk=el('span','mark'+(markV?' '+markV:''));head.appendChild(mk);
  head.appendChild(el('span','idx',idxText));
  card.appendChild(head);
  return card;
}

function judgeRow(){
  var j=el('div','judge');
  var n=el('button','no','모름'),o=el('button','ok','알아');
  n.onclick=function(){judge('no')};o.onclick=function(){judge('ok')};
  j.appendChild(n);j.appendChild(o);return j;
}

function navRow(i,n){
  var nav=el('div','nav');
  var p=el('button','','← 이전'),x=el('button','','다음 →');
  p.onclick=function(){step(-1)};x.onclick=function(){step(1)};
  p.disabled=i<=0;x.disabled=i>=n-1;
  if(p.disabled)p.style.opacity=.4;if(x.disabled)x.style.opacity=.4;
  nav.appendChild(p);nav.appendChild(el('span','sp',''));nav.appendChild(x);
  return nav;
}

function renderLinuxCard(a,i){
  var c=a[i];
  var card=cardShell(CH[c.ch]+' · '+c.t,(i+1)+' / '+a.length,marks.linux[c.id]);
  card.querySelector('.tag').textContent=CH[c.ch];
  card.appendChild(el('h2','title',esc(c.t)));
  linuxBody(c,card);
  var qz=el('div','quiz');
  qz.appendChild(el('div','lab','문제'));
  qz.appendChild(el('p','q',fmt(c.q)));
  if(!revealed){var b=el('button','reveal','답 보기');b.onclick=function(){revealed=true;render()};qz.appendChild(b)}
  else{qz.appendChild(el('div','ans',fmt(c.a)));qz.appendChild(judgeRow())}
  card.appendChild(qz);
  return card;
}

function renderOwaspCard(a,i){
  var c=a[i];
  var card=cardShell(c.id,(i+1)+' / '+a.length,marks.owasp[c.id]);
  var top=el('div','ow-top');
  top.appendChild(el('div','glyph',esc(c.g)));
  var nm=el('div','');nm.appendChild(el('div','ow-name',esc(c.nm)));nm.appendChild(el('div','ow-en',esc(c.en)));top.appendChild(nm);
  card.appendChild(top);
  var slots=el('div','slots');
  [['c','원인'],['e','예시'],['h','피해'],['f','대책']].forEach(function(s){
    var b=el('button','slot'+(shown[s[0]]?'':' hid'));
    b.appendChild(el('span','k',s[1]));b.appendChild(el('span','v',esc(c[s[0]])));
    b.setAttribute('aria-label',s[1]+(shown[s[0]]?'':' 가림'));
    b.onclick=function(){shown[s[0]]=!shown[s[0]];render()};
    slots.appendChild(b);
  });
  card.appendChild(slots);
  var tools=el('div','tools');
  var all=['c','e','h','f'].every(function(k){return shown[k]});
  var t1=el('button','',all?'전부 가리기':'전부 보기');t1.onclick=function(){var v=!all;shown={c:v,e:v,h:v,f:v};render()};
  var t2=el('button','','답안');t2.setAttribute('aria-pressed',essay?'true':'false');t2.onclick=function(){essay=!essay;render()};
  tools.appendChild(t1);tools.appendChild(t2);card.appendChild(tools);
  if(essay)card.appendChild(el('div','essay',esc(c.s)));
  card.appendChild(judgeRow());
  return card;
}

function attachSwipe(card){
  var x0=null,y0=0,dx=0,id=null;
  card.addEventListener('pointerdown',function(e){if(e.target.closest('button'))return;x0=e.clientX;y0=e.clientY;dx=0;id=e.pointerId});
  card.addEventListener('pointermove',function(e){if(x0===null||e.pointerId!==id)return;dx=e.clientX-x0;if(Math.abs(dx)<8||Math.abs(e.clientY-y0)>Math.abs(dx))return;card.classList.add('drag');card.style.transform='translateX('+dx+'px) rotate('+dx/40+'deg)'});
  function end(){if(x0===null)return;x0=null;card.classList.remove('drag');if(Math.abs(dx)>80){card.style.transform='';step(dx<0?1:-1)}else{card.classList.add('back');card.style.transform='';setTimeout(function(){card.classList.remove('back')},500)}}
  card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
}

function renderOrder(){
  var wrap=el('div','order');
  var tools=el('div','otools');
  [['이름 보기',0],['이름 가리기',1],['전부 가리기',2]].forEach(function(o){
    var b=chip(o[0],st.hide===o[1],function(){st.hide=o[1];shownTiles={};save();render()});tools.appendChild(b);
  });
  wrap.appendChild(tools);
  [[0,4],[4,8],[8,10]].forEach(function(r){
    var row=el('div','trow');
    O.slice(r[0],r[1]).forEach(function(c){
      var t=el('button','tile');
      var open=shownTiles[c.id];
      if(!open&&st.hide>=1)t.classList.add('hn');
      if(!open&&st.hide>=2)t.classList.add('hg');
      t.appendChild(el('span','n',c.id));t.appendChild(el('span','g',esc(c.g)));t.appendChild(el('span','nm',esc(c.nm)));
      t.onclick=function(){shownTiles[c.id]=!shownTiles[c.id];render()};
      row.appendChild(t);
    });
    wrap.appendChild(row);
  });
  return wrap;
}
var shownTiles={};

function renderGlance(){
  var g=el('div','glance');
  if(st.deck==='linux'){
    var cur=null;
    L.forEach(function(c){
      if(c.ch!==cur){cur=c.ch;var h=el('div','lab',esc(CH[cur]));h.style.margin='14px 0 0';g.appendChild(h)}
      var b=el('div','gcard');b.appendChild(el('h3','',esc(c.t)));linuxBody(c,b);
      b.appendChild(el('div','qa','<strong>'+fmt(c.q)+'</strong><br>→ '+fmt(c.a)));
      g.appendChild(b);
    });
  } else {
    g.appendChild(el('div','lab','답안 틀'));
    g.appendChild(el('div','tpl','<b>[이름]</b>이란 <b>[원인]</b>(으)로 발생하는 취약점이다. 예를 들어 <b>[예시]</b>하는 경우가 있다. 이로 인해 <b>[피해]</b> 등의 피해가 발생할 수 있다. 이를 예방하려면 <b>[대책]</b>을 적용해야 한다.'));
    var tw=el('div','tw'),tb=el('table');
    tb.innerHTML='<thead><tr><th></th><th>이름</th><th>원인</th><th>예시</th><th>피해</th><th>대책</th></tr></thead>';
    var body=el('tbody');
    O.forEach(function(c){var tr=el('tr');tr.innerHTML='<td class="k">'+esc(c.g)+'</td><td class="nm">'+esc(c.id)+' '+esc(c.nm)+'</td><td>'+esc(c.c)+'</td><td>'+esc(c.e)+'</td><td>'+esc(c.h)+'</td><td>'+esc(c.f)+'</td>';body.appendChild(tr)});
    tb.appendChild(body);tw.appendChild(tb);g.appendChild(el('div','lab','10개 한눈에'));g.appendChild(tw);
  }
  return g;
}

function render(){
  main.innerHTML='';
  var m=mode();
  if(m==='all'){main.appendChild(renderGlance());return}
  if(m==='order'){main.appendChild(renderOrder());return}
  var a=list();
  var stage=el('div','stage');
  if(!a.length){stage.appendChild(el('div','empty','모름 표시한 카드 없음'));main.appendChild(stage);return}
  var i=Math.min(st.idx[st.deck],a.length-1);st.idx[st.deck]=i;
  var card=st.deck==='linux'?renderLinuxCard(a,i):renderOwaspCard(a,i);
  attachSwipe(card);
  stage.appendChild(card);
  stage.appendChild(navRow(i,a.length));
  main.appendChild(stage);
}

document.getElementById('dk-linux').onclick=function(){if(st.deck==='linux')return;st.deck='linux';revealed=false;shown={};essay=false;go(-1)};
document.getElementById('dk-owasp').onclick=function(){if(st.deck==='owasp')return;st.deck='owasp';revealed=false;shown={};essay=false;go(1)};
document.addEventListener('keydown',function(e){
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  if(e.key==='ArrowRight')step(1);
  else if(e.key==='ArrowLeft')step(-1);
  else if(e.key===' '&&mode()!=='all'){e.preventDefault();if(st.deck==='linux'){if(!revealed){revealed=true;render()}}else{shown={c:true,e:true,h:true,f:true};render()}}
  else if(e.key==='1'&&(revealed||st.deck==='owasp'))judge('no');
  else if(e.key==='2'&&(revealed||st.deck==='owasp'))judge('ok');
});
renderBars();render();
})();
</script>
